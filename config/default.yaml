# gen2 configuration
# All thresholds are documented with meaning and default values.

# ─── Paths ───
paths:
  data_dir: "data"
  model_dir: "data/models"
  captures_dir: "data/captures"         # enrollment face crops
  snapshots_dir: "data/snapshots"      # attendance session snapshots
  eval_dir: "data/eval"                # evaluation artifacts
  biometric_db: "data/biometric.db"     # SQLite: identities + embeddings
  attendance_db: "data/attendance.db"   # SQLite: sessions + attendance

# ─── Model files ───
models:
  detector: "scrfd_10g_bnkps.onnx"                     # InsightFace SCRFD-10G with keypoints
  embedder: "glintr100.onnx"                            # InsightFace ArcFace ResNet100, Glint360K, FP32, 512-d
  liveness: "MiniFASNetV2.onnx"                        # anti-spoofing, 3 classes

# ─── Pipeline versions (for embedding compatibility tracking) ───
pipeline_version:
  detector: "scrfd_10g_bnkps"
  landmarks: "scrfd_5pt"
  alignment: "arcface_112_simtransform_v1"
  embedder: "glintr100_glint360k"
  preprocessing: "arcface_v1"             # BGR→RGB, (x-127.5)/127.5, NCHW
  liveness: "minifasnet_v2"
  config: 2

# ─── ONNX Runtime ───
onnx:
  # Listed in priority order. ONNX-RT auto-skips unavailable providers.
  # Windows RTX 3050+: TensorRT > CUDA > CPU
  # Mac M4: CoreML > CPU
  providers: ["TensorrtExecutionProvider", "CUDAExecutionProvider", "CoreMLExecutionProvider", "CPUExecutionProvider"]
  intra_op_threads: 0                     # 0 = let ONNX-RT decide

# ─── Face Detection (SCRFD-10G) ───
detector:
  backend: "scrfd"                         # "scrfd" or "yunet"
  score_threshold: 0.5                    # minimum detection confidence
  nms_threshold: 0.4                       # NMS IoU (SCRFD default)
  top_k: 50                               # max faces per frame
  min_face_size: 48                       # reject faces smaller than this (px)
  input_size: [640, 640]                  # SCRFD optimal input size

# ─── Alignment (ArcFace 5-point similarity transform) ───
alignment:
  output_size: [112, 112]                  # ArcFace input size
  # Canonical 5-point template for 112x112 ArcFace (from InsightFace reference)
  template:
    - [38.2946, 51.6963]                  # left eye
    - [73.5318, 51.5014]                  # right eye
    - [56.0252, 71.7366]                  # nose
    - [41.5493, 92.3655]                  # left mouth corner
    - [70.7299, 92.2041]                  # right mouth corner
  interpolation: "linear"                 # cv2.INTER_LINEAR
  border_mode: "constant"                 # cv2.BORDER_CONSTANT (black)
  min_landmark_confidence: 0.0            # YuNet doesn't give per-landmark conf; use 0

# ─── Embedding (ArcFace) ───
embedding:
  dimension: 512
  dtype: "float32"
  normalize: "l2"                          # L2 normalization
  # Preprocessing: resize→112x112, BGR→RGB, (x-127.5)/127.5, HWC→NCHW
  color_order: "rgb"
  value_range: [-1.0, 1.0]
  # Validation limits
  min_magnitude: 0.99                     # L2 norm must be ≥ 0.99 after normalization
  max_magnitude: 1.01

# ─── Quality Assessment ───
quality:
  min_face_size: 48                       # px; below → FACE_TOO_SMALL (hard reject)
  blur_threshold: 15.0                    # Laplacian variance; advisory (soft)
  brightness_min: 30.0                    # mean pixel; below → TOO_DARK (advisory)
  brightness_max: 230.0                   # above → OVEREXPOSED (advisory)
  contrast_min: 10.0                      # std dev of gray; below → LOW_CONTRAST (advisory)
  max_pose_yaw: 45.0                      # degrees; estimated from landmarks (advisory)
  max_pose_pitch: 45.0
  max_pose_roll: 45.0
  min_detector_confidence: 0.5            # below → advisory
  # Overall acceptance threshold (0-1); weighted combination
  # Only hard-rejects are FACE_TOO_SMALL, LANDMARK_FAILURE, CROP_EMPTY
  # All other quality issues are advisory — they lower the score
  # but a face can still pass if overall score is above this threshold
  min_overall_score: 0.30

# ─── Recognition / Matching ───
recognition:
  # Distance metric for L2-normalized embeddings: cosine = dot product
  distance_metric: "cosine"
  # ACCEPT threshold: above this → KNOWN (if unambiguous)
  # Calibrated for InsightFace w600k_r50 FP32 model:
  #   - genuine pairs typically score 0.5–0.8+
  #   - impostor pairs typically score < 0.25
  #   - 0.40 is a balanced operating point
  accept_threshold: 0.40
  # AMBIGUITY margin: if best - second_best < this → AMBIGUOUS
  ambiguity_margin: 0.10
  # REJECT threshold: below this → definitely UNKNOWN
  reject_threshold: 0.25
  # Top-k candidates to retrieve
  top_k: 5
  # Max results to return per face
  max_matches_per_face: 1

# ─── Enrollment ───
enrollment:
  min_samples: 5                           # minimum valid samples to enroll
  max_samples: 8                           # capture up to this many
  capture_delay: 1.0                      # seconds between captures
  min_overall_quality: 0.45               # overall quality score to accept a sample
  # Intra-person consistency: min pairwise cosine similarity among samples
  min_intra_similarity: 0.40              # below → INCONSISTENT_ENROLLMENT (FP32 has better consistency)
  # Duplicate detection: if best cosine sim to existing identity > this → POSSIBLE_DUPLICATE
  duplicate_threshold: 0.50
  # Above this → AMBIGUOUS (might be same person, needs human review)
  duplicate_ambiguous_threshold: 0.65
  # Template strategy: "centroid" (mean of L2-normalized embeddings, re-normalized)
  template_strategy: "centroid"
  # Whether to store individual sample embeddings alongside the template
  store_samples: true

# ─── Tracking ───
tracking:
  # IoU-based tracker with identity voting
  iou_threshold: 0.3                       # IoU below this → no association
  max_track_age: 15                        # frames a track can survive without detection
  min_track_hits: 3                       # detections before track is confirmed
  # Identity voting buffer: per-track history of recognition results
  vote_buffer_size: 5                     # last N recognition results per track
  # Min fraction of votes for an identity to be "confirmed"
  vote_min_fraction: 0.6
  # Min absolute votes for confirmation
  vote_min_count: 3

# ─── Liveness / Anti-Spoofing ───
liveness:
  enabled: true
  # MiniFASNetV2: classes = [print, real, screen]
  real_threshold: 0.50                     # real_prob ≥ this → LIVE
  # Context crop scale (crop 2x the face bbox for phone-edge detection)
  crop_scale: 2.0
  input_size: 80                           # MiniFASNetV2 input size
  # Run liveness only at attendance-decision time, NOT on every preview frame
  run_on_preview: false                    # set true for debug mode

# ─── Attendance ───
attendance:
  # Session checks schedule
  demo_mode: true                          # seconds-based for testing
  check_times_demo: [10, 20, 30]           # seconds from session start
  check_times_normal: [15, 30, 45]         # minutes from session start
  frame_interval_demo: 0.5                # seconds between frames in a check
  frame_interval_normal: 6
  frames_per_check: 3                     # 3 frames × 0.5s = ~1.5s per check
  # Min "present" checks to mark attendance
  min_checks_for_present: 2
  # Temporal confirmation: track must be identity-confirmed for this many
  # consecutive frames within a check to count as present
  min_confirmation_frames: 2
  # Darkness handling
  brightness_min: 35.0
  brightness_max: 240.0
  brightness_recoverable: 25.0
  max_retries_per_check: 3
  dark_retry_delay_demo: 8                # seconds
  dark_retry_delay_normal: 30
  brightness_monitor_interval: 10         # seconds

# ─── Camera ───
camera:
  index: 0
  width: 640
  height: 480
  backend: "default"                       # "default" or "dshow" (Windows)
  webrtc_enabled: true                     # use streamlit-webrtc for live preview

# ─── Logging ───
logging:
  level: "INFO"                            # DEBUG, INFO, WARNING, ERROR
  # Never log raw embeddings or face images in production
  log_embeddings: false
  log_face_images: false
  log_recognition_decisions: true
  format: "%(asctime)s [%(name)s] %(levelname)s: %(message)s"
