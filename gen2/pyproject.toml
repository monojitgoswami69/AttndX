[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "attnx-gen2"
version = "1.0.0"
description = "gen2 — clean-room rebuild of the face attendance system"
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = [".."]

[tool.setuptools]
packages = ["gen2"]
